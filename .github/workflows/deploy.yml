name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul déploiement à la fois ; les pushes suivants annulent les runs en attente.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # base = / : le site est servi à la racine du domaine de public/CNAME.
      # Clé "anon" Supabase, publique par nature (protégée par les policies RLS
      # côté serveur, pas par sa confidentialité) — absente tant que les secrets
      # du dépôt ne sont pas renseignés, l'app reste alors utilisable en local.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # enablement active Pages sur le dépôt au premier run, sans passage
      # manuel par Settings → Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
